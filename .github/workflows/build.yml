name: Build

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

env:
  DOTNET_ROOT: ${{ env.DOTNET_ROOT }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - run: dotnet tool install -g vpk
      - run: npm ci
      - run: npm run release
      - name: Upload to GitHub Release
        shell: pwsh
        run: vpk upload github --repoUrl https://github.com/venderecultus/bootcord --token ${{ secrets.GITHUB_TOKEN }} --publish true
      - uses: actions/upload-artifact@v4
        with:
          name: bootcord
          path: Releases/
