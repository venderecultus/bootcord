name: Build

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

env:
  DOTNET_ROOT: ${{ env.DOTNET_ROOT }}

jobs:
  sentrux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Sentrux
        shell: bash
        run: |
          curl -L -o sentrux https://github.com/sentrux/sentrux/releases/latest/download/sentrux-linux-x86_64
          chmod +x sentrux
          sudo install sentrux /usr/local/bin/sentrux
      - run: sentrux check .

  build:
    runs-on: windows-latest
    needs: sentrux
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - run: dotnet tool install -g vpk
      - run: npm ci
      - run: npm run release
      - name: Upload to GitHub Release
        shell: pwsh
        run: vpk upload github --repoUrl https://github.com/venderecultus/bootcord --token ${{ secrets.GITHUB_TOKEN }} --publish true
      - uses: actions/upload-artifact@v4
        with:
          name: bootcord
          path: Releases/
