<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
var params = new URLSearchParams(window.location.search);
var sourceId = params.get('sourceId');

if (!sourceId) {
  window.electronAPI.captureError('No source ID provided');
} else {
  startCapture(sourceId);
}

function getSupportedMimeType() {
  var types = [
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm;codecs=avc1.42E01E',
    'video/webm'
  ];
  for (var i = 0; i < types.length; i++) {
    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(types[i])) {
      return types[i];
    }
  }
  return 'video/webm';
}

async function startCapture(sourceId) {
  try {
    var stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        mandatory: {
          chromeMediaSource: 'desktop',
          chromeMediaSourceId: sourceId,
          maxWidth: 1280,
          maxHeight: 720,
          maxFrameRate: 30
        }
      }
    });

    var videoTrack = stream.getVideoTracks()[0];
    if (!videoTrack || videoTrack.readyState !== 'live') {
      throw new Error('Video track is not live');
    }

    var mimeType = getSupportedMimeType();
    console.log('[Capture] Using MIME type:', mimeType);

    var recorder = new MediaRecorder(stream, {
      mimeType: mimeType,
      videoBitsPerSecond: 2500000
    });

    var firstChunk = true;
    var chunkCount = 0;

    recorder.ondataavailable = function (e) {
      if (e.data.size > 0) {
        chunkCount++;
        console.log('[Capture] Chunk', chunkCount, 'size:', e.data.size, 'bytes');
        e.data.arrayBuffer().then(function (buf) {
          if (firstChunk) {
            firstChunk = false;
            console.log('[Capture] Sending config:', mimeType);
            window.electronAPI.sendScreenConfig(mimeType);
          }
          window.electronAPI.sendScreenFrame(buf);
        });
      }
    };

    recorder.onstop = function () {
      stream.getTracks().forEach(function (t) { t.stop(); });
      window.electronAPI.captureEnded();
    };

    recorder.onerror = function () {
      window.electronAPI.captureError('MediaRecorder error');
    };

    recorder.start(100);
    window.electronAPI.captureStarted();

    videoTrack.addEventListener('ended', function () {
      if (recorder.state !== 'inactive') {
        recorder.stop();
      }
    });
  } catch (error) {
    window.electronAPI.captureError(error.message || 'Unknown error');
  }
}
</script>
</body>
</html>
