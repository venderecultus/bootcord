<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bootcord icon</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0c;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  gap: 32px;
  padding: 40px;
}
.section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.label {
  color: #5865f2;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
}
.sub {
  color: #555;
  font-size: 12px;
  letter-spacing: 2px;
}
.sizes {
  display: flex;
  gap: 40px;
  align-items: flex-end;
  flex-wrap: wrap;
  justify-content: center;
}
.sz {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.sz span {
  color: #555;
  font-size: 10px;
  font-family: monospace;
}
.info {
  color: #444;
  font-size: 12px;
  text-align: center;
  line-height: 2;
  background: #111;
  border: 1px solid #1e1f22;
  border-radius: 12px;
  padding: 14px 24px;
}
.info code {
  color: #5865f2;
  background: rgba(88,101,242,0.08);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
}
</style>
</head>
<body>

<div class="section">
  <div class="label">bootcord</div>

  <svg viewBox="0 0 512 512" width="320" height="320" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#111214"/>
        <stop offset="100%" stop-color="#1a1b1f"/>
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>

    <g filter="url(#glow)">
      <path d="M 100 150 L 320 256 L 100 362" fill="none" stroke="#5865f2" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="350" y="348" width="80" height="16" rx="4" fill="#5865f2"/>
    </g>
  </svg>

  <div class="sub">terminal prompt icon</div>
</div>

<div class="sizes">
  <div class="sz">
    <svg viewBox="0 0 512 512" width="48" height="48">
      <rect width="512" height="512" rx="116" fill="#111214"/>
      <path d="M 100 150 L 320 256 L 100 362" fill="none" stroke="#5865f2" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="350" y="348" width="80" height="16" rx="4" fill="#5865f2"/>
    </svg>
    <span>48px</span>
  </div>
  <div class="sz">
    <svg viewBox="0 0 512 512" width="96" height="96">
      <rect width="512" height="512" rx="116" fill="#111214"/>
      <path d="M 100 150 L 320 256 L 100 362" fill="none" stroke="#5865f2" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="350" y="348" width="80" height="16" rx="4" fill="#5865f2"/>
    </svg>
    <span>96px</span>
  </div>
  <div class="sz">
    <svg viewBox="0 0 512 512" width="192" height="192">
      <rect width="512" height="512" rx="116" fill="#111214"/>
      <path d="M 100 150 L 320 256 L 100 362" fill="none" stroke="#5865f2" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="350" y="348" width="80" height="16" rx="4" fill="#5865f2"/>
    </svg>
    <span>192px</span>
  </div>
  <div class="sz">
    <svg viewBox="0 0 512 512" width="256" height="256">
      <rect width="512" height="512" rx="116" fill="#111214"/>
      <path d="M 100 150 L 320 256 L 100 362" fill="none" stroke="#5865f2" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="350" y="348" width="80" height="16" rx="4" fill="#5865f2"/>
    </svg>
    <span>256px</span>
  </div>
</div>

<div class="info">
  <code>bootcord-icon.html</code> → открыть в браузере → скриншот → PNG/ICO<br>
  для Electron: заменить <code>src/icon.png</code> (256x256) + <code>src/icon.ico</code>
</div>

</body>
</html>
